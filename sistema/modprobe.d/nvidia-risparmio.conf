# Runtime power management "fine grained" per la scheda discreta.
#
# 0x02 = la GPU puo' spegnersi del tutto (D3cold) quando nessuno la sta usando,
# non solo mettersi in idle. Su un portatile con una discreta a bordo e' il
# singolo risparmio piu' grosso che si possa fare: fra "sospesa" e "spenta" ci
# sono grosso modo dieci watt.
#
# Vale da Turing in poi; la RTX 4060 e' Ada, quindi rientra.
#
# ATTENZIONE, il vincolo che rende questa riga meta' inutile da sola: perche' la
# scheda arrivi davvero in D3cold, nessuno deve tenere aperto un file descriptor
# DRM verso di lei. hyprland.lua elenca la dGPU in AQ_DRM_DEVICES, e aquamarine
# apre quel device all'avvio e lo tiene aperto per tutta la sessione. Se cosi'
# fosse, questa opzione non produrrebbe niente.
#
# Non si tira a indovinare: verifica.sh stampa
#     /sys/bus/pci/devices/0000:01:00.0/power/runtime_status
# e li' si legge com'e' messa davvero. Se dice "active" mentre non ci sono
# programmi che usano la GPU, allora togliere ":/dev/dri/dgpu" da AQ_DRM_DEVICES
# vale quei dieci watt — si perde solo l'uscita HDMI, che e' cablata sulla
# discreta e serve unicamente con un monitor esterno collegato.
options nvidia NVreg_DynamicPowerManagement=0x02
