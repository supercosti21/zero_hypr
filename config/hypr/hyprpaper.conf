################################################################################
#  hyprpaper — sfondo statico, ~15 MB di RAM e zero CPU a regime.
#
#  ATTENZIONE alla sintassi (hyprpaper 0.8.4). Le vecchie righe "piatte"
#      preload   = /percorso/immagine.jpg
#      wallpaper = eDP-1,/percorso/immagine.jpg
#  non danno NESSUN errore ma vengono ignorate in silenzio: nel log compare
#  "Monitor eDP-1 has no target: no wp will be created" e lo sfondo resta nero.
#  E' esattamente cio' che stava succedendo qui. La forma valida e' il blocco
#  `wallpaper { }` qui sotto. Anche il comando IPC `preload` non esiste piu':
#  `hyprctl hyprpaper wallpaper` carica l'immagine da solo.
#
#  Questo file non va modificato a mano: usa SUPER+W, che e' lo script
#  ~/.config/hypr/scripts/sfondo.sh. Cambia lo sfondo subito E riscrive la riga
#  `path` qui dentro, cosi' la scelta resta anche dopo il riavvio.
################################################################################

wallpaper {
    # Monitor vuoto = tutti quelli collegati, adesso e in futuro: non serve
    # toccare niente quando si attacca un monitor esterno.
    monitor =
    path = /home/pol/Git/wallpapers/abstract.jpg
}

# Nessuna schermata di avvio di hyprpaper.
splash = false
ipc = on
