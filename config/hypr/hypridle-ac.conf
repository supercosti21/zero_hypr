################################################################################
#  hypridle — profilo ALIMENTATORE COLLEGATO
#  Tempi rilassati: il portatile e' alla rete, non c'e' fretta di spegnere.
#  Caricato automaticamente da ~/.config/hypr/scripts/power-watch.sh
################################################################################

general {
    # Il "pidof" evita di aprire due lockscreen sovrapposti.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 5 min: abbassa la luminosita' (la ripristina al primo movimento)
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 15 min: blocca lo schermo
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# 20 min: spegne il pannello
listener {
    timeout = 1200
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# In AC nessuna sospensione automatica: puo' restare a compilare o scaricare.
