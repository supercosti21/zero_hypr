################################################################################
#  hyprlock — schermata di blocco
################################################################################

general {
    hide_cursor = true
    ignore_empty_input = true
    # grace = 0 -> blocca subito, nessuna finestra di tolleranza.
    grace = 0
}

animations {
    enabled = true
    bezier = dolce, 0.25, 1.0, 0.5, 1.0
    animation = fade, 1, 4, dolce
}

# Lo stesso sfondo del desktop, sfocato e scurito.
background {
    monitor =
    path = /usr/share/backgrounds/cosmic/webb-inspired-wallpaper-system76.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.011
    contrast = 0.9
    brightness = 0.45
    vibrancy = 0.17
}

# --- Orologio ---
label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = rgba(cdd6f4ff)
    font_size = 110
    font_family = MesloLGS Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# --- Data ---
label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = rgba(a6adc8ff)
    font_size = 20
    font_family = MesloLGS Nerd Font
    position = 0, 95
    halign = center
    valign = center
}

# --- Utente ---
label {
    monitor =
    text =   $USER
    color = rgba(b4befeff)
    font_size = 15
    font_family = MesloLGS Nerd Font
    position = 0, 10
    halign = center
    valign = center
}

# --- Campo password ---
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.32
    dots_center = true

    outer_color = rgba(89b4faff)
    inner_color = rgba(1e1e2edd)
    font_color  = rgba(cdd6f4ff)
    check_color = rgba(f9e2afff)
    fail_color  = rgba(f38ba8ff)

    rounding = 14
    fade_on_empty = false
    placeholder_text = <span foreground="##7f849c">password</span>
    fail_text = <span foreground="##f38ba8">errata ($ATTEMPTS)</span>

    position = 0, -60
    halign = center
    valign = center
}

# --- Stato batteria in basso a destra ---
label {
    monitor =
    text = cmd[update:30000] printf "  %s%%" "$(cat /sys/class/power_supply/BAT1/capacity)"
    color = rgba(a6adc8ff)
    font_size = 14
    font_family = MesloLGS Nerd Font
    position = -30, 25
    halign = right
    valign = bottom
}
