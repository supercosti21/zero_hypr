################################################################################
#  hyprlock — schermata di blocco
################################################################################

general {
    hide_cursor = true
    ignore_empty_input = true
    # grace = 0 -> blocca subito, nessuna finestra di tolleranza.
    grace = 0
}

animations {
    enabled = true
    bezier = dolce, 0.25, 1.0, 0.5, 1.0
    animation = fade, 1, 4, dolce
}

# Lo stesso sfondo del desktop, sfocato e scurito.
#
# La riga `path` la riscrive scripts/sfondo.sh ad ogni SUPER+W, esattamente come
# fa con hyprpaper.conf: cosi' la schermata di blocco segue lo sfondo invece di
# restare ferma su un'immagine di mesi prima. Prima era un percorso fisso dentro
# un pacchetto (i wallpaper di COSMIC): su un'installazione dove quel pacchetto
# non c'e', hyprlock non trovava niente e restava nero.
#
# Vuota fino al primo SUPER+W: senza `path` hyprlock usa `color`, cioe' un fondo
# pieno. Meno bello di un'immagine, ma e' comunque una schermata di blocco che
# si vede — non un rettangolo nero che sembra un blocco andato storto.
background {
    monitor =
    path =
    color = rgba(0e1514ff)
    blur_passes = 3
    blur_size = 8
    noise = 0.011
    contrast = 0.9
    brightness = 0.45
    vibrancy = 0.17
}

# --- Orologio ---
label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = rgba(cdd6f4ff)
    font_size = 110
    font_family = MesloLGS Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# --- Data ---
label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = rgba(a6adc8ff)
    font_size = 20
    font_family = MesloLGS Nerd Font
    position = 0, 95
    halign = center
    valign = center
}

# --- Utente ---
label {
    monitor =
    text =   $USER
    color = rgba(b4befeff)
    font_size = 15
    font_family = MesloLGS Nerd Font
    position = 0, 10
    halign = center
    valign = center
}

# --- Campo password ---
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.32
    dots_center = true

    outer_color = rgba(89b4faff)
    inner_color = rgba(1e1e2edd)
    font_color  = rgba(cdd6f4ff)
    check_color = rgba(f9e2afff)
    fail_color  = rgba(f38ba8ff)

    rounding = 14
    fade_on_empty = false
    placeholder_text = <span foreground="##7f849c">password</span>
    fail_text = <span foreground="##f38ba8">errata ($ATTEMPTS)</span>

    position = 0, -60
    halign = center
    valign = center
}

# --- Stato batteria in basso a destra ---
label {
    monitor =
    text = cmd[update:30000] printf "  %s%%" "$(cat /sys/class/power_supply/BAT1/capacity)"
    color = rgba(a6adc8ff)
    font_size = 14
    font_family = MesloLGS Nerd Font
    position = -30, 25
    halign = right
    valign = bottom
}
