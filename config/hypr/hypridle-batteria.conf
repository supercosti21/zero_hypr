################################################################################
#  hypridle — profilo BATTERIA
#  Tempi aggressivi: lo schermo e' il maggior consumatore del portatile.
#  Caricato automaticamente da ~/.config/hypr/scripts/power-watch.sh
################################################################################

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 1 min: abbassa la luminosita'
listener {
    timeout = 60
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 3 min: blocca
listener {
    timeout = 180
    on-timeout = loginctl lock-session
}

# 4 min: spegne il pannello (qui il risparmio vero, ~3-5 W)
listener {
    timeout = 240
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 15 min: sospensione a RAM
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
