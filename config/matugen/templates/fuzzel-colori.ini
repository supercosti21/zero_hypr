# GENERATO DA MATUGEN — non modificare a mano.
# Sorgente: ~/.config/matugen/templates/fuzzel-colori.ini
# Incluso da fuzzel.ini con `include=~/.config/fuzzel/colori.ini`.
#
# fuzzel vuole RRGGBBAA senza cancelletto. L'alpha e6 sul fondo non e'
# estetica: e' cio' che fa scattare il blur (layerrule su namespace launcher).

[colors]
background={{colors.surface.default.hex_stripped}}e6
text={{colors.on_surface.default.hex_stripped}}ff
prompt={{colors.on_surface_variant.default.hex_stripped}}ff
placeholder={{colors.outline.default.hex_stripped}}ff
input={{colors.on_surface.default.hex_stripped}}ff
match={{colors.primary.default.hex_stripped}}ff
selection={{colors.surface_container_high.default.hex_stripped}}ff
selection-text={{colors.on_surface.default.hex_stripped}}ff
selection-match={{colors.primary.default.hex_stripped}}ff
counter={{colors.outline.default.hex_stripped}}ff
border={{colors.primary.default.hex_stripped}}ff
