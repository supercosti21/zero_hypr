# =============================================================================
#  Portal XDG sotto Hyprland
#
#  Necessario perche' gtk.portal e gnome-keyring.portal dichiarano "UseIn=gnome":
#  fuori da GNOME non vengono caricati da soli. Senza questo file mancherebbero
#  i dialoghi "Apri/Salva file" e il portachiavi per Brave e i tool di sviluppo.
#
#  cosmic.portal ha "UseIn=COSMIC" e quindi resta fuori da solo: le due sessioni
#  non si pestano i piedi.
#
#  Verifica a sessione avviata:
#     systemctl --user status xdg-desktop-portal
#     journalctl --user -u xdg-desktop-portal -b | grep -i backend
# =============================================================================

[preferred]
# Prima Hyprland (screenshot, condivisione schermo, scorciatoie globali),
# poi GTK come rete di sicurezza per tutto il resto.
default = hyprland;gtk

# Dialoghi file: GTK. Hyprland non implementa FileChooser.
org.freedesktop.impl.portal.FileChooser = gtk

# Portachiavi (password salvate di Brave, token di sviluppo).
org.freedesktop.impl.portal.Secret = gnome-keyring

# Tema chiaro/scuro e preferenze di aspetto lette dalle app Flatpak/Electron.
org.freedesktop.impl.portal.Settings = gtk

# Condivisione schermo e screenshot: espressamente a Hyprland.
org.freedesktop.impl.portal.ScreenCast = hyprland
org.freedesktop.impl.portal.Screenshot = hyprland
