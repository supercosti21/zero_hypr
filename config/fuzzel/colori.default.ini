# SEME INIZIALE — non e' questo il file che fuzzel legge.
# installa.sh lo copia in colori.ini (che e' in .gitignore) su una macchina
# nuova: sono i colori che si vedono finche' non si cambia sfondo la prima
# volta, e quelli su cui il launcher ripiega se matugen non fosse disponibile.
#
# Questo seme NON e' decorativo: fuzzel.ini fa `include=` di colori.ini e senza
# quel file il launcher parte senza colori, con i suoi default grigi.
#
# I ruoli di partenza sono gli stessi di config/hypr/colori.default.lua e
# config/swaync/colori.default.css: bordo, launcher e centro notifiche sono le
# tre cose che condividono l'accento, e stonerebbero fra loro se partissero da
# palette diverse.
#
# Sorgente vera: ~/.config/matugen/templates/fuzzel-colori.ini. Per cambiare
# COME i colori vengono assegnati si modifica quello, non questo.
#
# fuzzel vuole RRGGBBAA senza cancelletto.

[colors]
# L'alpha e6 sul fondo non e' estetica: e' cio' che fa scattare il blur
# (layerrule su namespace launcher in hyprland.lua).
background=0e1514e6
text=dde4e3ff
prompt=bec8c8ff
placeholder=899392ff
input=dde4e3ff
match=80d4d5ff
selection=1a2121ff
selection-text=dde4e3ff
selection-match=80d4d5ff
counter=899392ff
border=80d4d5ff
