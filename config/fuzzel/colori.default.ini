# GENERATO DA MATUGEN — non modificare a mano.
#
# Questo file viene riscritto ad ogni cambio sfondo (SUPER+W) a partire da
# ~/.config/matugen/templates/fuzzel-colori.ini. Se vuoi cambiare come i
# colori vengono assegnati, modifica QUEL file, non questo.
#
# I valori qui sotto sono solo il fallback iniziale (Catppuccin Mocha): sono
# quelli che si vedono finche' non si cambia sfondo la prima volta, e quelli
# su cui il launcher ripiega se matugen non fosse disponibile.
#
# fuzzel vuole RRGGBBAA senza cancelletto. L'alpha e6 sul fondo non e'
# estetica: e' cio' che fa scattare il blur (layerrule su namespace launcher).

[colors]
background=1e1e2ee6
text=cdd6f4ff
prompt=a6adc8ff
placeholder=585b70ff
input=cdd6f4ff
match=89b4faff
selection=45475aff
selection-text=cdd6f4ff
selection-match=89b4faff
counter=585b70ff
border=89b4faff
