# =============================================================================
#  fuzzel — launcher. Scelto al posto di wofi/rofi perche' e' nativo Wayland,
#  parte in pochi millisecondi e sta in poche centinaia di KB di RAM.
#  Si apre con SUPER+R (o SUPER+D). SUPER+V lo riusa per lo storico appunti.
# =============================================================================

[main]
# Colori: generati da matugen dallo sfondo (SUPER+W). Il percorso deve essere
# assoluto oppure iniziare con "~/" — nient'altro viene espanso. Qui si usa la
# tilde di proposito: con un /home/<utente> scritto a mano il repo funzionava
# solo sulla macchina di chi lo ha scritto.
include=~/.config/fuzzel/colori.ini

font=MesloLGS Nerd Font:size=12
dpi-aware=no
prompt="   "

icons-enabled=yes
icon-theme=Papirus-Dark

terminal=alacritty -e
layer=overlay

# Larghezza in caratteri, non in pixel.
width=45
lines=12

horizontal-pad=22
vertical-pad=16
inner-pad=8
line-height=24

# Ordina per frequenza d'uso: dopo qualche giorno le app che usi davvero
# compaiono per prime dopo una o due lettere.
sort-result=yes
match-mode=fuzzy
fuzzy-min-length=3


[border]
width=2
radius=14

[dmenu]
exit-immediately-if-empty=yes

[key-bindings]
# Ctrl+J / Ctrl+K per muoversi, coerente col resto del setup.
next=Down Control+j
prev=Up Control+k
