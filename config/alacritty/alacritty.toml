# ==============================================================================
#  Alacritty — terminale. Scelto perche' e' accelerato in GPU e parte in pochi
#  millisecondi. I colori NON stanno qui: arrivano da colori.toml, che
#  ~/.config/hypr/scripts/colori-terminale.py ricostruisce ad ogni cambio
#  sfondo (SUPER+W) dalla palette di matugen, con il contrasto garantito.
#  Alacritty rilegge la config al salvataggio, quindi le finestre aperte
#  cambiano colore da sole.
# ==============================================================================

general.import = ["~/.config/alacritty/colori.toml"]

[colors]
# Il grassetto usa la variante brillante del colore. E' il default di molti
# terminali ma non di Alacritty, e cambia parecchio: il grassetto colorato lo
# usano fastfetch per le etichette, i prompt e quasi tutte le TUI, e la variante
# brillante e' quella costruita per stare a un contrasto piu' alto.
draw_bold_text_with_bright_colors = true

[window]
padding = { x = 10, y = 8 }
dynamic_padding = true
opacity = 1.0
decorations = "none"

[font]
normal = { family = "MesloLGS Nerd Font", style = "Regular" }
size = 11.0

[scrolling]
history = 10000

[cursor]
style = { shape = "Block", blinking = "Off" }
